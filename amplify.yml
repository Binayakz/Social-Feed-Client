version: 1

frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@10.33.4 --activate
        - pnpm install --frozen-lockfile

    build:
      commands:
        - printf "BACKEND_API_BASE_URL=%s\n" "$BACKEND_API_BASE_URL" >> .env.production
        - pnpm run build

  artifacts:
    baseDirectory: .next
    files:
      - "**/*"

  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
      - ~/.pnpm-store/**/*
